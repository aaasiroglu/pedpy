[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pedx"
version = "0.1.0.dev0"
description = "Explainable, physics-coupled decision support for Positive Energy Districts on H3 hexagons"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abdurrahim Arif Asiroglu" }]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
h3 = ["h3>=4.0"]
diff = ["jax>=0.4.20"]
mcdm = ["scipy>=1.10"]
test = ["pytest>=7"]
all = ["h3>=4.0", "jax>=0.4.20", "scipy>=1.10"]
dev = ["h3>=4.0", "jax>=0.4.20", "scipy>=1.10", "pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
